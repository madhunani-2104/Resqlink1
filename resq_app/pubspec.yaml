name: resq_app
description: "ResQ - Offline Mesh Communication & SOS Emergency System"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  badges: ^3.1.2

  # State management
  provider: ^6.1.2

  # Networking / WebRTC
  dio: ^5.11.0
  connectivity_plus: ^6.0.3
  socket_io_client: ^2.0.3+1
  flutter_webrtc: ^1.6.0

  # Database / storage
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  shared_preferences: ^2.2.3
  path_provider: ^2.1.6
  path: ^1.9.0

  # Maps / location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2

  # Contacts
  flutter_contacts: ^2.3.1

  # SOS audio / vibration
  audioplayers: ^6.8.1
  vibration: ^3.1.3

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  image_picker: ^1.2.3
  record: ^7.1.1
  network_info_plus: ^8.2.1
  url_launcher: ^6.3.2

  # Android permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/